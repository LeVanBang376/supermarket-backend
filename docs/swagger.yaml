definitions:
  gin.H:
    additionalProperties: {}
    type: object
  supermarket-backend_internal_dto.BranchResponse:
    properties:
      address:
        type: string
      branch_id:
        type: string
      branch_name:
        type: string
    type: object
  supermarket-backend_internal_dto.CreateBranchRequest:
    properties:
      address:
        maxLength: 150
        type: string
      branch_name:
        maxLength: 100
        type: string
    required:
    - address
    - branch_name
    type: object
  supermarket-backend_internal_dto.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  supermarket-backend_internal_dto.LoginResponse:
    properties:
      access_token:
        type: string
      user:
        $ref: '#/definitions/supermarket-backend_internal_dto.UserResponse'
    type: object
  supermarket-backend_internal_dto.PositionResponse:
    properties:
      position_id:
        type: string
      position_name:
        type: string
    type: object
  supermarket-backend_internal_dto.RoleResponse:
    properties:
      created_at:
        type: string
      role_id:
        type: string
      role_name:
        type: string
      updated_at:
        type: string
    type: object
  supermarket-backend_internal_dto.UpdateBranchRequest:
    properties:
      address:
        maxLength: 150
        type: string
      branch_name:
        maxLength: 100
        type: string
    type: object
  supermarket-backend_internal_dto.UserResponse:
    properties:
      branch:
        $ref: '#/definitions/supermarket-backend_internal_dto.BranchResponse'
