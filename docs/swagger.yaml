definitions:
  gin.H:
    additionalProperties: {}
    type: object
  supermarket-backend_internal_dto.BranchResponse:
    properties:
      address:
        type: string
      branch_id:
        type: string
      branch_name:
        type: string
      type:
        $ref: '#/definitions/supermarket-backend_internal_model.BranchType'
    type: object
  supermarket-backend_internal_dto.BrandResponse:
    properties:
      brand_id:
        type: string
      brand_name:
        type: string
    type: object
  supermarket-backend_internal_dto.CreateBranchRequest:
    properties:
      address:
        maxLength: 150
        type: string
      branch_name:
        maxLength: 100
        type: string
      type:
        allOf:
        - $ref: '#/definitions/supermarket-backend_internal_model.BranchType'
        enum:
        - HEADQUARTERS
        - SUPERMARKET
        - SUPPLIER
    required:
    - address
    - branch_name
    - type
    type: object
  supermarket-backend_internal_dto.CreateBrandRequest:
    properties:
      brand_name:
        maxLength: 30
        type: string
    required:
    - brand_name
    type: object
  supermarket-backend_internal_dto.CreateImportRequestProduct:
    properties:
      quantity:
        type: integer
      sku_barcode:
        type: string
    required:
    - quantity
    - sku_barcode
    type: object
  supermarket-backend_internal_dto.CreateImportRequestRequest:
    properties:
      branch_id:
        type: string
      expected_delivery_at:
        type: string
      products:
        items:
          $ref: '#/definitions/supermarket-backend_internal_dto.CreateImportRequestProduct'
        minItems: 1
        type: array
    required:
    - branch_id
    - expected_delivery_at
    - products
    type: object
  supermarket-backend_internal_dto.CreateSKURequest:
    properties:
      brand_id:
        maxLength: 5
        type: string
      shelf_life_days:
        minimum: 0
        type: integer
      sku_barcode:
        maxLength: 30
        type: string
      sku_name:
        maxLength: 50
        type: string
      unit_id:
        maxLength: 5
        type: string
    required:
    - brand_id
    - shelf_life_days
    - sku_barcode
    - sku_name
    - unit_id
    type: object
  supermarket-backend_internal_dto.CreateUnitRequest:
    properties:
      unit_name:
        maxLength: 30
        type: string
    required:
    - unit_name
    type: object
  supermarket-backend_internal_dto.ImportRequestProductResponse:
    properties:
      loaded_quantity:
        type: integer
      quantity:
        type: integer
      received_quantity:
        type: integer
      sku_barcode:
        type: string
      sku_name:
        type: string
      tote_barcode:
        type: string
    type: object
  supermarket-backend_internal_dto.ImportRequestResponse:
    properties:
      branch:
        $ref: '#/definitions/supermarket-backend_internal_dto.BranchResponse'
      complete_at:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      creator:
        $ref: '#/definitions/supermarket-backend_internal_dto.UserResponse'
      delivery_license_plate:
        type: string
      expected_delivery_at:
        type: string
      products:
        items:
          $ref: '#/definitions/supermarket-backend_internal_dto.ImportRequestProductResponse'
        type: array
      received_by:
        type: string
      receiver:
        $ref: '#/definitions/supermarket-backend_internal_dto.UserResponse'
      request_id:
        type: string
      status:
        type: string
      totes:
        items:
          $ref: '#/definitions/supermarket-backend_internal_dto.ImportRequestToteResponse'
        type: array
      updated_at:
        type: string
    type: object
  supermarket-backend_internal_dto.ImportRequestToteResponse:
    properties:
      tote_barcode:
        type: string
    type: object
  supermarket-backend_internal_dto.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  supermarket-backend_internal_dto.LoginResponse:
    properties:
      access_token:
        type: string
      user:
        $ref: '#/definitions/supermarket-backend_internal_dto.UserResponse'
    type: object
  supermarket-backend_internal_dto.PositionResponse:
    properties:
      position_id:
        type: string
      position_name:
        type: string
    type: object
  supermarket-backend_internal_dto.RoleResponse:
    properties:
      created_at:
        type: string
      role_id:
        type: string
      role_name:
        type: string
      updated_at:
        type: string
    type: object
  supermarket-backend_internal_dto.SKUResponse:
    properties:
      brand_id:
        type: string
      brand_name:
        type: string
      shelf_life_days:
        type: integer
      sku_barcode:
        type: string
      sku_name:
        type: string
      unit_id:
        type: string
      unit_name:
        type: string
    type: object
  supermarket-backend_internal_dto.StockResponse:
    properties:
      branch_id:
        type: string
      quantity:
        type: integer
      sku_barcode:
        type: string
    type: object
  supermarket-backend_internal_dto.UnitResponse:
    properties:
      unit_id:
        type: string
      unit_name:
        type: string
    type: object
  supermarket-backend_internal_dto.UpdateBranchRequest:
    properties:
      address:
        maxLength: 150
        type: string
      branch_name:
        maxLength: 100
        type: string
      type:
        allOf:
        - $ref: '#/definitions/supermarket-backend_internal_model.BranchType'
        enum:
        - HEADQUARTERS
        - SUPERMARKET
        - SUPPLIER
    type: object
  supermarket-backend_internal_dto.UpdateBrandRequest:
    properties:
      brand_name:
        maxLength: 30
        type: string
    type: object
  supermarket-backend_internal_dto.UpdateImportRequestProduct:
    properties:
      loaded_quantity:
        minimum: 0
        type: integer
      quantity:
        type: integer
      received_quantity:
        minimum: 0
        type: integer
      sku_barcode:
        type: string
      tote_barcode:
        type: string
    required:
    - sku_barcode
    type: object
  supermarket-backend_internal_dto.UpdateImportRequestRequest:
    properties:
      branch_id:
        type: string
      delivery_license_plate:
        type: string
      expected_delivery_at:
        type: string
      products:
        items:
          $ref: '#/definitions/supermarket-backend_internal_dto.UpdateImportRequestProduct'
        type: array
      products_barcode_to_delete:
        items:
          type: string
        type: array
      received_by:
        type: string
    type: object
  supermarket-backend_internal_dto.UpdateImportRequestStatusRequest:
    properties:
      status:
        type: string
    required:
    - status
    type: object
  supermarket-backend_internal_dto.UpdateSKURequest:
    properties:
      brand_id:
        maxLength: 5
        type: string
      shelf_life_days:
        minimum: 0
        type: integer
      sku_name:
        maxLength: 50
        type: string
      unit_id:
        maxLength: 5
        type: string
    type: object
  supermarket-backend_internal_dto.UpdateUnitRequest:
    properties:
      unit_name:
        maxLength: 30
        type: string
    type: object
  supermarket-backend_internal_dto.UserResponse:
    properties:
      branch:
        $ref: '#/definitions/supermarket-backend_internal_dto.BranchResponse'
