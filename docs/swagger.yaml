        type: string
      full_name:
        type: string
      phone_number:
        type: string
      position:
        $ref: '#/definitions/supermarket-backend_internal_dto.PositionResponse'
      role:
        $ref: '#/definitions/supermarket-backend_internal_dto.RoleResponse'
      status:
        type: string
      user_id:
        type: string
      username:
        type: string
    type: object
  supermarket-backend_internal_model.BranchType:
    enum:
    - HEADQUARTERS
    - SUPERMARKET
    - SUPPLIER
    type: string
    x-enum-varnames:
    - BranchTypeHeadquarters
    - BranchTypeSupermarket
    - BranchTypeSupplier
