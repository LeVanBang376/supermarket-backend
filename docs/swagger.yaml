definitions:
  supermarket-backend_internal_dto.BranchResponse:
    properties:
      address:
        type: string
      branch_id:
        type: string
      branch_name:
        type: string
    type: object
  supermarket-backend_internal_dto.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  supermarket-backend_internal_dto.LoginResponse:
    properties:
      access_token:
        type: string
      user:
        $ref: '#/definitions/supermarket-backend_internal_dto.UserResponse'
    type: object
  supermarket-backend_internal_dto.PositionResponse:
    properties:
      position_id:
        type: string
      position_name:
        type: string
    type: object
  supermarket-backend_internal_dto.RoleResponse:
    properties:
      created_at:
        type: string
      role_id:
        type: string
      role_name:
        type: string
      updated_at:
        type: string
    type: object
  supermarket-backend_internal_dto.UserResponse:
    properties:
      branch:
        $ref: '#/definitions/supermarket-backend_internal_dto.BranchResponse'
      email:
        type: string
      full_name:
        type: string
      phone_number:
        type: string
      position:
        $ref: '#/definitions/supermarket-backend_internal_dto.PositionResponse'
      role:
        $ref: '#/definitions/supermarket-backend_internal_dto.RoleResponse'
      status:
        type: string
      user_id:
        type: string
      username:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: SmallSupermarket APIs
  title: SmallSupermarket APIs
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate a user and set the access token in an HttpOnly cookie
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/supermarket-backend_internal_dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/supermarket-backend_internal_dto.LoginResponse'
        "400":
          description: Invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: User login
      tags:
      - Auth
  /auth/me:
    get:
      description: Get information of the currently authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/supermarket-backend_internal_dto.UserResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - CookieAuth: []
      summary: Get current user
      tags:
      - Auth
securityDefinitions:
  CookieAuth:
    in: cookie
    name: access_token
    type: apiKey
swagger: "2.0"
